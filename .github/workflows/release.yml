name: Release Assets to Public Repository

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Checkout private repository code.
      - name: Checkout Private Repository
        uses: actions/checkout@v3

      # Set up Node.js and build the project.
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          
      - name: Install Dependencies and Build
        run: |
          npm install
          npm run build
          npm run package

      # Manually clone the public repository.
      - name: Clone Public Repository
        run: |
          git clone https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/Deepak-png981/AI-Code-Reviewer-Release.git public-release

      # Extract version from package.json and update a VERSION file in the public repo.
      - name: Update Version in Public Repository
        run: |
          version=$(jq -r '.version' package.json)
          echo "Using version: $version"
          echo "$version" > public-release/VERSION

      # Copy built files to the public repository, excluding the .git directory.
      - name: Copy Built Files to Public Repository
        run: |
          rsync -av --delete --exclude='.git' --exclude='VERSION' dist/ public-release/

          
      # Commit and push the changes to the public repository.
      - name: Commit and Push Changes
        working-directory: public-release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Release update:- Version $(cat VERSION)"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
