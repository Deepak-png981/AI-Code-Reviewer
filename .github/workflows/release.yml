name: Release to Marketplace

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the private repository code.
      - name: Checkout Private Repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js and install dependencies.
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          
      - name: Install Dependencies and Build
        run: |
          npm install
          npm run build
          npm run package

      # Step 3: Checkout the public repository into a subdirectory.
      - name: Checkout Public Repository
        uses: actions/checkout@v3
        with:
          repository: Deepak-png981/AI-Code-Reviewer-Release
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public-release

      # Step 4: Set the correct remote URL explicitly (for both fetch and push).
      - name: Set Remote URL for Public Repository
        working-directory: public-release
        run: |
          # Set the fetch URL
          git remote set-url origin https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/Deepak-png981/AI-Code-Reviewer-Release.git
          # Set the push URL explicitly
          git remote set-url --push origin https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/Deepak-png981/AI-Code-Reviewer-Release.git
          # (Optional) Verify the remotes
          git remote -v

      # Step 5: Copy the contents of the dist folder to the public repository.
      - name: Copy Built Files to Public Repository
        run: |
          # Ensure the public-release folder exists
          if [ ! -d public-release ]; then
            echo "Public repository folder not found"
            exit 1
          fi
          # Copy over the built files (adjust paths if necessary)
          rsync -av --delete dist/ public-release/
          
      # Step 6: Commit and push the changes to the public repository.
      - name: Commit and Push Changes
        working-directory: public-release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Release update: $(date)"
            # Explicitly push to origin and the main branch
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
