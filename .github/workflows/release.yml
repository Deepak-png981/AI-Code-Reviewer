name: Release to Marketplace

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the private repository code.
      - name: Checkout Private Repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js and install dependencies.
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          
      - name: Install Dependencies and Build
        run: |
          npm install
          npm run build
          npm run package

      # Step 3: Manually clone the public repository.
      - name: Clone Public Repository
        run: |
          git clone https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/Deepak-png981/AI-Code-Reviewer-Release.git public-release

      # Step 4: Copy the contents of the dist folder to the public repository.
      - name: Copy Built Files to Public Repository
        run: |
          if [ ! -d public-release ]; then
            echo "Public repository folder not found"
            exit 1
          fi
          rsync -av --delete dist/ public-release/

      # Step 5: Commit and push the changes to the public repository.
      - name: Commit and Push Changes
        working-directory: public-release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Release update: $(date)"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
