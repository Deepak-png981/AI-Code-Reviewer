name: Release Assets to Public Repository

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout private repository code.
      - name: Checkout Private Repository
        uses: actions/checkout@v3

      # 2. Set up Node.js and build your project.
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          
      - name: Install Dependencies and Build
        run: |
          npm install
          npm run build
          npm run package

      # 3. Clone the public repository.
      - name: Clone Public Repository
        run: |
          git clone https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/Deepak-png981/AI-Code-Reviewer-Release.git public-release

      # 4. Ensure the target dist/ folder exists in the public repo.
      - name: Ensure dist/ folder exists
        run: |
          mkdir -p public-release/dist

      # 5. Copy only the built files into the public repo's dist/ folder.
      - name: Copy Built Files to Public Repository
        run: |
          rsync -av --delete dist/ public-release/dist/

      # 6. Update the VERSION file in the public repo's dist folder after rsync.
      - name: Update Version in Public Repository
        run: |
          version=$(node -p "require('./package.json').version")
          echo "Using version: $version"
          echo "$version" > public-release/dist/VERSION
          echo "VERSION file content:"
          cat public-release/dist/VERSION

      # 7. Commit and push the changes to the public repository.
      - name: Commit and Push Changes
        working-directory: public-release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Release update: $(date) - Version $(cat dist/VERSION)"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
